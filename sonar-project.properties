# SonarQube Cloud (https://sonarcloud.io), run from .github/workflows/ci.yml
# once the SONAR_TOKEN secret exists. Org and key are the defaults SonarQube
# Cloud assigns when a GitHub repo is imported; change them here if yours differ.
sonar.organization=pritesh1980
sonar.projectKey=Pritesh1980_sable
sonar.projectName=Sable

sonar.sources=src
sonar.tests=src/test,e2e
sonar.test.inclusions=src/test/**,e2e/**
# The shipped Big London line-up is data held as text (see CLAUDE.md), not
# code to grade; it would dominate duplication otherwise.
sonar.exclusions=src/test/**,src/data/lineups/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

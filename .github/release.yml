# Sections for GitHub's generated release notes ("Generate release notes" on
# a new release). PRs land in a section by label; pr-labels.yml applies the
# label from the PR's conventional-commit title (feat: → feature, ...), and
# Dependabot labels its own PRs "dependencies".
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
    - title: Fixes
      labels:
        - fix
    - title: Performance
      labels:
        - performance
    - title: Docs
      labels:
        - docs
    - title: Tests and CI
      labels:
        - test
        - ci
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'

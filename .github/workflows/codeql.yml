name: CodeQL

# Static security analysis of the app's JavaScript. Worth having here because
# Sable handles user-supplied OpenAI/Gemini keys, parses untrusted text from
# screenshots and pasted line-ups, and ships an eval(atob(...)) bookmarklet
# (lineupGrabber.js). That last one WILL be flagged: it is deliberate (see
# CLAUDE.md), so dismiss the alert as "used in tests"/"won't fix" with a note
# pointing there rather than changing the code. Findings appear under
# Security → Code scanning, and on the PR diff.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new CodeQL queries run against unchanged code too.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      # No build needed: CodeQL extracts JavaScript straight from source.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyse
        uses: github/codeql-action/analyze@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Parse every Mermaid block in tracked Markdown before application checks.
      - name: Validate Mermaid documentation
        run: npm run docs:check
      # Blocking (#32 closed the last known violations). ESLint exits 1 for
      # rule violations and 2 for a fatal config/crash error — both fail CI
      # now. (The eslint 10 bump once crashed the linter outright while CI
      # stayed green, having never run it at all; a plain `npx eslint .` here
      # fails loudly on either kind of problem instead.)
      - name: Lint
        run: npx eslint .
      # Suite is pinned to the offline local backend via vite.config.js test.env,
      # so no secrets or external services are needed here.
      - name: Run tests
        run: npm test
      - name: Build production app
        run: npm run build

  # Browser tests (e2e/, Playwright): real layout, touch gestures, stacking,
  # canvas, WebGL, a fake camera and downloads, on an emulated iPhone plus a
  # desktop pass and a /sable/ sub-path build. Runs beside the unit job so it
  # adds no wall-clock time; builds its own copies (playwright.config.js).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      # Traces, screenshots and the HTML report — enough to debug a failure
      # without reproducing it locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

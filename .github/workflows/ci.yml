name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Parse every Mermaid block in tracked Markdown before application checks.
      - name: Validate Mermaid documentation
        run: npm run docs:check
      # ESLint exits 1 for rule violations and 2 for a fatal config/crash error.
      # Only the latter fails CI: the repo still carries known react-hooks errors
      # (#32), so a blocking lint step would be permanently red and get ignored.
      # This catches the case that actually bit us — the eslint 10 bump crashed
      # the linter outright, and CI was green because it never ran eslint at all.
      - name: Check ESLint runs
        run: |
          lint_status=0
          npx eslint . || lint_status=$?
          if [ "$lint_status" -ge 2 ]; then
            echo "::error::ESLint failed to run (exit $lint_status) — config or dependency problem, not a lint violation."
            exit 1
          fi
          echo "ESLint ran (exit $lint_status); rule violations are tracked in #32."
      # Suite is pinned to the offline local backend via vite.config.js test.env,
      # so no secrets or external services are needed here.
      - name: Run tests
        run: npm test
      - name: Build production app
        run: npm run build
